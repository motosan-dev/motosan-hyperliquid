name: Publish to crates.io

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --features ws,k256-signer

      - name: Publish crates
        run: |
          set -euo pipefail
          # Publish in dependency order. Tolerate an "already exists" result
          # (idempotent re-runs / partial releases) but fail the job on any
          # other error instead of silently swallowing it.
          publish() {
            local crate="$1"
            local out
            if out=$(cargo publish -p "$crate" 2>&1); then
              echo "::notice::published $crate"
            elif printf '%s' "$out" | grep -qE "already (exists|uploaded)"; then
              echo "::notice::$crate already on crates.io — skipping"
            else
              printf '%s\n' "$out"
              echo "::error::failed to publish $crate"
              exit 1
            fi
          }
          crates="hl-types hl-signing hl-client hl-market hl-account hl-executor motosan-hyperliquid"
          for crate in $crates; do
            publish "$crate"
            if [ "$crate" != "motosan-hyperliquid" ]; then
              echo "waiting for crates.io index propagation..."
              sleep 30
            fi
          done
